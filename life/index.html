<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#11151C">
<title>Life — Rahul Kumar Das</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;800&family=Public+Sans:wght@400;500;600&family=Azeret+Mono:wght@400;500;600&display=swap">
<style>

:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --sunk:#E7EBEF; --line:#D8DEE5; --line-soft:#E9EDF1;
  --ink:#151B23; --ink-2:#4C5766; --ink-3:#8895A6;
  --accent:#1F5FCC; --accent-ink:#FFFFFF;
  --good:#1F7A56; --warn:#A96A12; --bad:#B33A2B;
  --work:#3B6FD4; --study:#7B5EC7; --health:#2E8B6B; --family:#C8683C;
  --self:#B08A18; --money:#357F99; --home:#7C8593;
  --meals:#C8683C; --mind:#8A6BC4; --content:#A8567F; --projects:#3D7FA0;
  --lifestyle:#8C7A4A; --travel:#2F8392;
  --sleep:#5A6478; --meal:#C8683C; --class:#7B5EC7; --gym:#2E8B6B;
  --entertainment:#A8567F; --commute:#7C8593; --admin:#7C8593;
  --display:"Epilogue",system-ui,-apple-system,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Azeret Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-sm:7px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1016; --surface:#141A22; --sunk:#1B222C; --line:#242E3A; --line-soft:#1D2632;
  --ink:#E6EBF1; --ink-2:#9FAEC0; --ink-3:#6B7B8F;
  --accent:#5B94F0; --accent-ink:#0C1016;
  --good:#43A87C; --warn:#D19B3E; --bad:#DD6A58;
  --work:#6D9BF2; --study:#A98BE8; --health:#4FB18B; --family:#E08A5C;
  --self:#D6AC3A; --money:#5BA8C4; --home:#9AA5B4;
  --meals:#E08A5C; --mind:#A98BE8; --content:#CE7FA6; --projects:#5E9FBF;
  --lifestyle:#B2A06C; --travel:#52A4B3;
  --sleep:#8792A8; --meal:#E08A5C; --class:#A98BE8; --gym:#4FB18B;
  --entertainment:#CE7FA6; --commute:#9AA5B4; --admin:#9AA5B4;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0C1016; --surface:#141A22; --sunk:#1B222C; --line:#242E3A; --line-soft:#1D2632;
  --ink:#E6EBF1; --ink-2:#9FAEC0; --ink-3:#6B7B8F;
  --accent:#5B94F0; --accent-ink:#0C1016;
  --good:#43A87C; --warn:#D19B3E; --bad:#DD6A58;
  --work:#6D9BF2; --study:#A98BE8; --health:#4FB18B; --family:#E08A5C;
  --self:#D6AC3A; --money:#5BA8C4; --home:#9AA5B4;
  --meals:#E08A5C; --mind:#A98BE8; --content:#CE7FA6; --projects:#5E9FBF;
  --lifestyle:#B2A06C; --travel:#52A4B3;
  --sleep:#8792A8; --meal:#E08A5C; --class:#A98BE8; --gym:#4FB18B;
  --entertainment:#CE7FA6; --commute:#9AA5B4; --admin:#9AA5B4;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hide{display:none!important}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100dvh}
@media (max-width:820px){ .app{grid-template-columns:1fr} }

.rail{border-right:1px solid var(--line);background:var(--surface);padding:22px 14px 22px 18px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh}
.rail .brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;
  margin-bottom:4px}
.rail .who{font-size:12px;color:var(--ink-3);margin-bottom:18px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail button.nav{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;
  padding:9px 11px;border-radius:var(--r-sm);color:var(--ink-2);font-size:14.5px;font-weight:500}
.rail button.nav:hover{background:var(--sunk);color:var(--ink)}
.rail button.nav[aria-current="page"]{background:var(--sunk);color:var(--ink);font-weight:600}
.rail button.nav .ico{width:18px;text-align:center;font-size:15px;opacity:.85}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--ink-3)}
.rail .foot button{background:none;border:0;color:var(--ink-3);padding:0;text-align:left;font-size:12.5px}
.rail .foot button:hover{color:var(--ink)}
@media (max-width:820px){ .rail{display:none} }

.tabbar{display:none}
@media (max-width:820px){
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset:auto 0 0 0;z-index:50;
    background:var(--surface);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px 2px;color:var(--ink-3);font-size:10.5px;font-weight:500;border-radius:var(--r-sm)}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar .ico{font-size:17px;line-height:1}
}

main{min-width:0;padding:26px 26px 40px}
@media (max-width:820px){ main{padding:18px 16px calc(84px + env(safe-area-inset-bottom))} }
.view{max-width:980px;margin:0 auto}

/* ---------- bits ---------- */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  margin-bottom:20px}
.pagehead .date{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px}
.pagehead h1{font-size:clamp(23px,3.4vw,31px);font-weight:800;line-height:1.15}
.pagehead .sub{color:var(--ink-2);font-size:14.5px;margin-top:5px;max-width:56ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.card h2{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  font-family:var(--body)}
.card .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.card .bd{padding:14px 16px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){ .grid2{grid-template-columns:1fr} }
.stack{display:grid;gap:16px;align-content:start}

.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  padding:8px 15px;border-radius:var(--r-sm);font-size:14px;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink);filter:none}
.btn.sm{padding:5px 11px;font-size:13px;font-weight:500}
.btn[disabled]{opacity:.5;pointer-events:none}

input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],
select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 11px;font-size:14.5px}
textarea{resize:vertical;min-height:70px;line-height:1.55}
input[type=number],input[type=time],input[type=date]{font-family:var(--mono);font-size:13.5px}
label.fld{display:block;margin-bottom:12px}
label.fld > span{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
label.fld > .hint{font-weight:400;color:var(--ink-3);font-size:11.5px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row > *{flex:1 1 120px;min-width:0}
.row > .fit{flex:0 0 auto}

.empty{color:var(--ink-3);font-size:14px;line-height:1.55;padding:4px 0}
.msg{padding:10px 13px;border-radius:var(--r-sm);font-size:13.5px;margin-bottom:14px;
  border:1px solid var(--line)}
.msg.ok{background:color-mix(in srgb,var(--good) 12%,transparent);border-color:var(--good);color:var(--ink)}
.msg.err{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:var(--bad);color:var(--ink)}

/* ---------- today: the day rail ---------- */
.daylist{display:grid}
.blk{display:grid;grid-template-columns:84px 4px 1fr auto;gap:0 12px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line-soft)}
.blk:last-child{border-bottom:0}
.blk .t{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);line-height:1.35}
.blk .bar{align-self:stretch;border-radius:3px;background:var(--ink-3);min-height:22px}
.blk .lb{font-size:14.5px;min-width:0}
.blk .lb small{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
.blk .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.blk.past{opacity:.42}
.blk.now{background:color-mix(in srgb,var(--accent) 9%,transparent);
  margin-inline:-8px;padding-inline:8px;border-radius:var(--r-sm)}
.blk.now .lb{font-weight:600}
.blk.cal .tag::before{content:"cal · ";color:var(--accent)}

.bookend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
  color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;padding:6px 0}

/* ---------- tonight: the ritual ---------- */
.steprail{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.steprail .dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-3);font-family:var(--mono);font-size:11px;
  display:grid;place-items:center;padding:0;transition:.12s}
.steprail .dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steprail .dot[aria-current="step"]{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.stepsub{color:var(--ink-2);font-size:14px;line-height:1.55;margin:0 0 14px}
.stepnav{display:flex;gap:10px;justify-content:space-between;align-items:center;
  padding:13px 17px;border-top:1px solid var(--line-soft)}
.step .bd{min-height:96px}

.mealrow{display:grid;grid-template-columns:96px 112px 1fr;gap:8px;align-items:center;margin-bottom:9px}
.mealrow .sl{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3)}
@media (max-width:560px){ .mealrow{grid-template-columns:84px 1fr}
  .mealrow input[type=text]{grid-column:1/-1} }

.intent{border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 13px 2px;margin-bottom:11px;
  background:var(--sunk)}
.intent .hd{display:grid;grid-template-columns:auto 1fr 118px;gap:8px;align-items:center;margin-bottom:9px}
.intent .hd .n{font-family:var(--mono);font-size:13px;color:var(--ink-3);width:18px}
@media (max-width:560px){ .intent .hd{grid-template-columns:auto 1fr}
  .intent .hd select{grid-column:2} }

.rvhd{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 4px}
.rvrow{display:grid;grid-template-columns:116px 1fr;gap:12px;padding:7px 0;
  border-bottom:1px solid var(--line-soft);font-size:14.5px}
.rvrow:last-child{border-bottom:0}
.rvrow .k{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-transform:capitalize}
.rvrow .v small{display:block;color:var(--ink-3);font-size:12.5px}

/* ---------- the morning read-out ---------- */
.planned .theme{font-family:var(--display);font-size:19px;font-weight:500;line-height:1.35;
  margin:0 0 10px}
.upnext{background:var(--sunk);border-radius:var(--r-sm);padding:9px 12px;font-size:14px;
  color:var(--ink-2);margin:4px 0 2px}
.subhd{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 2px}
.mono{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}

/* ---------- news ---------- */
.newslist{display:grid;gap:0}
.nitem{display:grid;gap:2px;padding:10px 0;border-bottom:1px solid var(--line-soft);
  text-decoration:none;color:inherit}
.nitem:last-child{border-bottom:0}
.nitem:hover .hl{color:var(--accent)}
.nitem .hl{font-size:14.5px;line-height:1.4;font-weight:500}
.nitem .mt{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-3)}

/* ---------- tasks ---------- */
.task{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:10px 0;
  border-bottom:1px solid var(--line-soft)}
.task:last-child{border-bottom:0}
.tick{appearance:none;width:20px;height:20px;border:1.5px solid var(--ink-3);border-radius:5px;
  margin:1px 0 0;position:relative;flex:none;background:transparent;transition:.12s}
.tick:hover{border-color:var(--accent)}
.tick:checked{background:var(--accent);border-color:var(--accent)}
.tick:checked::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;
  border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
.task .tx{font-size:15px;line-height:1.45;cursor:pointer}
.task.done .tx{text-decoration:line-through;color:var(--ink-3)}
.task.done .tx small{text-decoration:none}
.chip{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;padding:2px 6px;border-radius:4px;color:#fff;white-space:nowrap}
.carrytag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:1px 5px;margin-left:6px}

/* ---------- meters ---------- */
.meter{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.meter:last-child{border-bottom:0}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.meter .nm{font-size:14.5px}
.meter .vl{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.track{height:6px;background:var(--sunk);border-radius:4px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:4px;background:var(--accent)}
.fill.good{background:var(--good)} .fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);opacity:.7}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--ink-3);margin-top:4px;gap:8px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line-soft)}
.kpi{background:var(--surface);padding:13px 15px}
.kpi .k{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:5px}
.kpi .v{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.02em}
.kpi .v.pos{color:var(--good)} .kpi .v.neg{color:var(--bad)}

/* ---------- journal form ---------- */
.dial{margin-bottom:15px}
.dial .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dial .lab span:first-child{font-size:13.5px;font-weight:500}
.dial .lab .num{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);height:22px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 14px;
  font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);font-weight:600}
.tasknum{display:grid;grid-template-columns:auto 1fr 118px;gap:8px;align-items:center;margin-bottom:9px}
.tasknum .n{font-family:var(--mono);font-size:13px;color:var(--ink-3);width:18px}
@media (max-width:560px){ .tasknum{grid-template-columns:auto 1fr;gap:6px}
  .tasknum select{grid-column:2} }

/* ---------- log ---------- */
.entry{border-bottom:1px solid var(--line-soft)}
.entry:last-child{border-bottom:0}
.entry summary{cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;gap:12px;
  align-items:baseline;list-style:none}
.entry summary::-webkit-details-marker{display:none}
.entry summary .d{font-family:var(--mono);font-size:13px;font-weight:600}
.entry summary .s{font-size:13px;color:var(--ink-3);text-align:right;font-family:var(--mono)}
.entry .inner{padding:2px 0 16px;display:grid;gap:12px}
.entry .qa .q{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:3px}
.entry .qa .a{font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.dials{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.dials b{color:var(--ink);font-weight:600}

/* ---------- week editor ---------- */
.daycol{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.daycol > h3{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  font-family:var(--body);padding:10px 13px;border-bottom:1px solid var(--line-soft);
  display:flex;justify-content:space-between;align-items:center}
.daycol > h3 .hrs{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-weight:400;
  letter-spacing:.04em;text-transform:none}
.daycol .items{padding:6px 13px 11px}
.ritem{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;padding:6px 0;
  border-bottom:1px solid var(--line-soft)}
.ritem:last-child{border-bottom:0}
.ritem .bar{align-self:stretch;border-radius:3px;min-height:20px}
.ritem .tx{font-size:14px}
.ritem .tx small{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.x{background:none;border:0;color:var(--ink-3);padding:2px 4px;font-size:15px;line-height:1;opacity:0}
.ritem:hover .x,.task:hover .x,.x:focus-visible{opacity:1}
.x:hover{color:var(--bad)}

/* ---------- capture ---------- */
.reclive{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--bad)}
.reclive .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.working{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);
  background:var(--sunk);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:12px}
.working small{flex-basis:100%;color:var(--ink-3);font-size:12.5px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ritem.on{background:color-mix(in srgb,var(--accent) 8%,transparent);
  margin-inline:-13px;padding-inline:13px;border-radius:var(--r-sm)}

/* ---------- sign in ---------- */
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate .box{max-width:400px;width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:30px 26px;box-shadow:var(--shadow)}
.gate h1{font-size:26px;font-weight:800;margin-bottom:7px}
.gate p{color:var(--ink-2);font-size:14.5px;margin:0 0 20px;line-height:1.55}
.gate .lock{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:16px}
</style>
</head>
<body>

<div id="app" class="app">
  <aside class="rail">
    <div class="brand">Life</div>
    <div class="who" id="railWho"></div>
    <nav id="navRail"></nav>
    <div class="foot">
      <button id="themeBtn">Switch theme</button>
    </div>
  </aside>

  <main>
    <div id="toast"></div>
    <div class="view" id="view"></div>
  </main>
  <nav class="tabbar" id="navTabs"></nav>
</div>

<script type="module">
/* ============================================================
   Life — rahulkd.com/life
   A single file on GitHub Pages. No server, no login, no database.
   Everything you write lives in this browser, under one localStorage key.
   The news is the one thing from outside: a GitHub Action fetches the feeds
   each morning and commits news.json next to this page, so the page only ever
   reads a file from its own origin.
   ============================================================ */

const KEY = "life:v2";
const AREAS = ["work","study","health","meals","mind","content",
               "projects","lifestyle","family","travel","money","home","self"];
const KINDS = ["sleep","meal","work","study","class","gym","family","self","entertainment","commute","admin"];
const SLOTS = ["breakfast","lunch","dinner","snack"];
const DAYS  = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MEAL_AT = {breakfast:"08:00", lunch:"12:30", dinner:"19:00", snack:"16:00"};
const MEAL_HINT = {breakfast:"Oats, banana, coffee", lunch:"Rice, dal, salad",
                   dinner:"Chicken, veg, roti",      snack:"Yoghurt and almonds"};
const QUICK = new Set(["scale","number","bool"]);

/* ---------- helpers ---------- */
const el  = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TZ = "Australia/Sydney";

function parts(d = new Date()){
  const f = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",
    day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
  const o = {}; for (const p of f.formatToParts(d)) o[p.type] = p.value; return o;
}
function isoDay(offset = 0){
  const p = parts();
  return new Date(Date.UTC(+p.year, +p.month - 1, +p.day) + offset * 86400000)
    .toISOString().slice(0,10);
}
const nowMin    = () => { const p = parts(); return (+p.hour % 24) * 60 + +p.minute; };
const weekdayOf = iso => new Date(iso + "T12:00:00Z").getUTCDay();
const toMin     = t => { if (!t) return 0; const [h,m] = t.split(":").map(Number); return h*60 + (m||0); };
function fmtT(t){
  if (!t) return "";
  const [h,m] = t.split(":").map(Number);
  const ap = h < 12 ? "am" : "pm", hh = h % 12 === 0 ? 12 : h % 12;
  return m ? `${hh}:${String(m).padStart(2,"0")}${ap}` : `${hh}${ap}`;
}
const longDate  = iso => new Date(iso+"T12:00:00Z").toLocaleDateString("en-AU",
  {timeZone:"UTC",weekday:"long",day:"numeric",month:"long"});
const shortDate = iso => new Date(iso+"T12:00:00Z").toLocaleDateString("en-AU",
  {timeZone:"UTC",day:"numeric",month:"short"});
function ago(ts){
  if (!ts) return "";
  const m = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (m < 60)  return m <= 1 ? "just now" : m + "m ago";
  const h = Math.round(m/60);
  return h < 36 ? h + "h ago" : Math.round(h/24) + "d ago";
}

/* ---------- what you start with ---------- */
function seed(){
  const Q = (sort, section, key, label, type, extra) =>
    Object.assign({sort, section, key, label, type, active:true}, extra || {});
  const R = (weekday, start, end, label, kind) => ({weekday, start, end, label, kind});

  const routine = [];
  for (let d = 0; d < 7; d++){
    routine.push(R(d,"08:00","08:30","Breakfast","meal"));
    routine.push(R(d,"12:30","13:00","Lunch","meal"));
    routine.push(R(d,"21:45","22:30","Wind down — screens off","self"));
  }
  [1,2,4].forEach(d => {
    routine.push(R(d,"09:00","17:00","Work","work"));
    routine.push(R(d,"18:00","20:00","Study","study"));
    routine.push(R(d,"19:00","19:40","Dinner","meal"));
  });
  routine.push(R(3,"09:00","12:30","Study — deep block","study"));
  routine.push(R(3,"13:30","16:30","Study — assignments","study"));
  routine.push(R(3,"19:00","19:40","Dinner","meal"));
  routine.push(R(5,"10:45","15:30","Class","class"));
  routine.push(R(5,"19:00","19:40","Dinner","meal"));
  routine.push(R(0,"10:00","12:30","Study — plan the week","study"));
  routine.push(R(0,"13:00","16:00","Family time","family"));
  routine.push(R(0,"19:00","19:40","Dinner","meal"));
  [1,3,5].forEach(d => routine.push(R(d,"06:45","07:45","Gym","gym")));
  [2,4].forEach(d => routine.push(R(d,"06:45","07:15","Walk or stretch","gym")));

  return {
    v: 2,
    settings: {name:"Rahul", wake:"06:30", sleep:"22:30"},
    questions: [
      Q(1,"The day, in numbers","day_rating","Day, out of ten","scale",{min:1,max:10,min_label:"rough",max_label:"great"}),
      Q(2,"The day, in numbers","energy","Energy","scale",{min:1,max:10}),
      Q(3,"The day, in numbers","stress","Stress","scale",{min:1,max:10,min_label:"calm",max_label:"fried"}),
      Q(4,"The day, in numbers","sleep_hours","Hours slept last night","number",{min:0,max:16,step:0.5,suffix:"hrs"}),
      Q(5,"The day, in numbers","moved_body","Did you move your body?","bool"),
      Q(6,"The day, in numbers","ate_well","Did you eat well?","bool"),
      Q(10,"Four or five words","wins","What went right today?","short",{help:"Four or five words. Even a small one counts."}),
      Q(11,"Four or five words","challenges","What got in the way?","short",{help:"Name it in a handful of words."}),
      Q(12,"Four or five words","habit_kept","Which habit did you keep?","short",{help:"Or the one you dropped. Either is useful."}),
      Q(13,"Four or five words","time_sink","Where did the time go?","short",{help:"Be honest. Four or five words."}),
      Q(14,"Four or five words","learned","What did you learn?","short",{help:"One thing. Short."}),
      Q(15,"Four or five words","one_change","One thing to do differently?","short",{help:"Tomorrow's small correction."})
    ],
    codes: [
      "Do the hardest thing first, while the day is still yours.",
      "Tired is not the same as done.",
      "Two hours of real study beats six hours of sitting near the books.",
      "Money you don't spend is the only kind you get to keep.",
      "Ring home. It costs you nothing and it's the whole point.",
      "You can do the next small thing, even on a bad day.",
      "Sleep is the assignment you hand in to tomorrow.",
      "Never miss twice."
    ],
    routine,
    entries: {},
    plans: {}
  };
}

/* ---------- the store ----------
   One key, one JSON blob, written on every change. Small enough that there is
   no reason to be cleverer, and a single blob is trivial to back up. */
let D = seed();
let S = {view:"today", news:null, newsErr:null, toast:null};

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return false;
    D = Object.assign(seed(), parsed);            // new seeded fields survive upgrades
    return true;
  } catch { return false; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(D)); return true; }
  catch (err){
    flash("Couldn't save — this browser is blocking storage, or it's full. "
        + "Back up from Setup before you lose anything.", "err");
    return false;
  }
}
function flash(msg, kind){
  S.toast = {msg, kind:kind || "ok"};
  render();
  clearTimeout(flash.t);
  flash.t = setTimeout(() => { S.toast = null; render(); }, kind === "err" ? 7000 : 3500);
}

/* ---------- the day, assembled ---------- */
const planFor  = iso => D.plans[iso] || null;
const entryFor = iso => D.entries[iso] || null;

function blocksFor(iso){
  const wd = weekdayOf(iso);
  return D.routine.filter(r => r.weekday === wd)
    .slice().sort((a,b) => toMin(a.start) - toMin(b.start));
}
function codeForDay(iso){
  if (!D.codes.length) return null;
  return D.codes[Number(iso.replace(/-/g,"")) % D.codes.length];
}
function activeQuestions(){
  return D.questions.filter(q => q.active).slice().sort((a,b) => a.sort - b.sort);
}
function greeting(){
  const h = Math.floor(nowMin()/60);
  const name = (D.settings.name || "").split(" ")[0];
  const g = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  return name ? `${g}, ${name}.` : g + ".";
}

/* ---------- shell ---------- */
const NAV = [
  {id:"today",   label:"Today",   ico:"◉"},
  {id:"tonight", label:"Tonight", ico:"☾"},
  {id:"news",    label:"News",    ico:"◈"},
  {id:"week",    label:"Week",    ico:"▦"},
  {id:"log",     label:"Log",     ico:"≡"},
  {id:"setup",   label:"Setup",   ico:"⚙"}
];
function renderNav(){
  const mk = rail => NAV.map(n =>
    `<button ${rail ? 'class="nav"' : ""} data-go="${n.id}" ${S.view === n.id ? 'aria-current="page"' : ""}>
       <span class="ico">${n.ico}</span>${n.label}</button>`).join("");
  el("navRail").innerHTML = mk(true);
  el("navTabs").innerHTML = mk(false);
  el("railWho").textContent = D.settings.name || "";
}
function render(){
  renderNav();
  const v = el("view");
  v.innerHTML = ({today:viewToday, tonight:viewTonight, news:viewNews,
                  week:viewWeek, log:viewLog, setup:viewSetup}[S.view] || viewToday)();
  el("toast").innerHTML = S.toast
    ? `<div class="msg ${S.toast.kind === "err" ? "err" : "ok"}">${esc(S.toast.msg)}</div>` : "";
  window.scrollTo({top:0});
}

/* ===== TODAY — the morning read-back ===== */
function viewToday(){
  const iso = isoDay(), now = nowMin();
  const plan = planFor(iso);
  const code = codeForDay(iso);
  const blocks = blocksFor(iso);

  return `
  <div class="pagehead">
    <div><div class="date">${esc(longDate(iso))}</div>
      <h1>${esc(greeting())}</h1>
      ${plan && plan.theme ? `<p class="sub">${esc(plan.theme)}</p>` : ""}</div>
    <button class="btn ghost" data-go="tonight">Plan tonight →</button>
  </div>

  ${planCard(iso)}

  ${code ? `<div class="card" style="margin-bottom:16px"><div class="bd"
    style="display:flex;gap:13px;align-items:flex-start">
    <span style="font-size:18px;line-height:1.3">◆</span>
    <div><div class="subhd" style="margin:0 0 4px">Code for the day</div>
      <div style="font-family:var(--display);font-size:17px;font-weight:500;line-height:1.4">
        ${esc(code)}</div></div></div></div>` : ""}

  <div class="grid2">
    <div class="stack">
      <section class="card">
        <header><h2>The shape of it</h2>
          <span class="meta">${esc(fmtT((plan && plan.wake) || D.settings.wake))} – ${esc(fmtT((plan && plan.sleep) || D.settings.sleep))}</span></header>
        <div class="bd">
          <div class="daylist">
            ${blocks.length ? blocks.map(b => {
              const st = toMin(b.start), en = toMin(b.end);
              const cls = now > en ? "past" : (now >= st && now <= en ? "now" : "");
              return `<div class="blk ${cls}">
                <span class="t">${esc(fmtT(b.start))}<br>${esc(fmtT(b.end))}</span>
                <span class="bar" style="background:var(--${b.kind})"></span>
                <span class="lb">${esc(b.label)}</span>
                <span class="tag">${esc(b.kind)}</span></div>`;
            }).join("") : `<p class="empty">Nothing in your week for today. Set it under <b>Week</b>.</p>`}
          </div>
        </div>
      </section>
    </div>
    <div class="stack">${newsStrip()}</div>
  </div>`;
}

function planCard(iso){
  const plan = planFor(iso);
  if (!plan){
    const ahead = planFor(isoDay(1));
    return `<section class="card" style="margin-bottom:16px">
      <header><h2>${ahead ? "Tomorrow is set" : "Today wasn't planned"}</h2></header>
      <div class="bd">
        ${ahead ? `<p class="empty" style="margin-top:0">You've planned tomorrow — ${
            esc(ahead.theme || "it's written down")}. It shows up here in the morning.
            Today itself was never planned, so it's improvised.</p>`
          : `<p class="empty" style="margin-top:0">You didn't close out last night, so today is
            improvised. It still works — but five minutes tonight makes tomorrow a lot easier.</p>`}
        <button class="btn sm" data-go="tonight">${ahead ? "Change tomorrow" : "Plan tonight →"}</button>
      </div></section>`;
  }

  const meals = SLOTS.map(s => Object.assign({slot:s}, (plan.meals || {})[s] || {}))
    .filter(m => m.what || m.at);
  const ints  = Array.isArray(plan.intentions) ? plan.intentions : [];
  const tasks = Array.isArray(plan.tasks) ? plan.tasks : [];
  const now   = nowMin();
  const next  = ints.filter(i => !i.done && i.at && toMin(i.at) >= now)
    .sort((a,b) => toMin(a.at) - toMin(b.at))[0];

  return `<section class="card planned" style="margin-bottom:16px">
    <header><h2>Today, as you wrote it last night</h2>
      <span class="meta">${ints.length ? `${ints.filter(i=>i.done).length}/${ints.length} habits` : "no habits set"}</span></header>
    <div class="bd">
      ${plan.theme ? `<p class="theme">${esc(plan.theme)}</p>` : ""}
      <div class="bookend"><span>↑ Up ${esc(fmtT(plan.wake))}</span>
        <span>↓ Lights out ${esc(fmtT(plan.sleep))}</span></div>
      ${next ? `<div class="upnext">Next up — <b>${esc(next.what)}</b> at ${esc(fmtT(next.at))}${
        next.place ? `, ${esc(next.place)}` : ""}.</div>` : ""}

      ${tasks.length ? `<div class="subhd">The three</div>${tasks.map((t,i) => `
        <div class="task ${t.done ? "done" : ""}">
          <input type="checkbox" class="tick" data-task="${i}" ${t.done ? "checked" : ""}
            id="tk-${i}" aria-label="${esc(t.title)}">
          <label class="tx" for="tk-${i}">${esc(t.title)}</label>
          <span class="chip" style="background:var(--${t.area || "work"})">${esc(t.area || "work")}</span>
        </div>`).join("")}` : ""}

      ${ints.length ? `<div class="subhd">Habits</div>${ints.map((it,i) => `
        <div class="task ${it.done ? "done" : ""}">
          <input type="checkbox" class="tick" data-int="${i}" ${it.done ? "checked" : ""}
            id="in-${i}" aria-label="${esc(it.what)}">
          <label class="tx" for="in-${i}">${esc(it.what)}
            <small>${[it.at ? fmtT(it.at) : null, it.place || null,
              it.after ? "right after " + it.after : null].filter(Boolean).map(esc).join(" · ")}${
              it.two_min ? ` — bad day: ${esc(it.two_min)}` : ""}</small></label>
          <span class="chip" style="background:var(--${it.area || "self"})">${esc(it.area || "self")}</span>
        </div>`).join("")}` : ""}

      ${meals.length ? `<div class="subhd">Food</div>${meals.map(m => `
        <div class="task ${m.ate ? "done" : ""}">
          <input type="checkbox" class="tick" data-meal="${esc(m.slot)}" ${m.ate ? "checked" : ""}
            id="ml-${esc(m.slot)}" aria-label="Ate ${esc(m.slot)}">
          <label class="tx" for="ml-${esc(m.slot)}">${esc(m.slot[0].toUpperCase() + m.slot.slice(1))}
            <small>${esc(m.what || "nothing written down")}</small></label>
          <span class="mono">${esc(fmtT(m.at))}</span></div>`).join("")}` : ""}
    </div></section>`;
}

/* ===== the question renderer ===== */
function fieldHTML(q, val, bare){
  const id = "f_" + q.key, lab = bare ? "" : `<span>${esc(q.label)}</span>`;
  const help = q.help && !bare ? `<div class="hint">${esc(q.help)}</div>` : "";
  const opts = Array.isArray(q.options) ? q.options : [];

  if (q.type === "scale"){
    const min = q.min ?? 1, max = q.max ?? 10;
    const at = val ?? Math.round((Number(min) + Number(max)) / 2);
    return `<div class="dial">
      <div class="lab"><span>${esc(q.label)}</span><span class="num" id="v_${esc(q.key)}">${at}</span></div>
      <input type="range" id="${id}" data-f="${esc(q.key)}" min="${min}" max="${max}"
        step="${q.step ?? 1}" value="${at}" data-dial="${esc(q.key)}">
      ${(q.min_label || q.max_label) ? `<div class="scale"><span>${esc(q.min_label||"")}</span>
        <span>${esc(q.max_label||"")}</span></div>` : ""}</div>`;
  }
  if (q.type === "bool"){
    return `<label class="fld">${lab || `<span>${esc(q.label)}</span>`}
      <div class="seg" data-bool="${esc(q.key)}">
        <button type="button" data-v="1" aria-pressed="${val === true}">Yes</button>
        <button type="button" data-v="0" aria-pressed="${val === false}">No</button></div>${help}</label>`;
  }
  if (q.type === "choice"){
    return `<label class="fld">${lab}<div class="seg" data-choice="${esc(q.key)}">
      ${opts.map(o => `<button type="button" data-v="${esc(o)}"
        aria-pressed="${val === o}">${esc(o)}</button>`).join("")}</div>${help}</label>`;
  }
  if (q.type === "number"){
    return `<label class="fld">${bare ? "" : `<span>${esc(q.label)}${q.suffix ? ` (${esc(q.suffix)})` : ""}</span>`}
      <input type="number" id="${id}" data-f="${esc(q.key)}"
        ${q.min != null ? `min="${q.min}"` : ""} ${q.max != null ? `max="${q.max}"` : ""}
        step="${q.step ?? 1}" value="${val ?? ""}">${help}</label>`;
  }
  if (q.type === "para"){
    return `<label class="fld">${lab}<textarea id="${id}" data-f="${esc(q.key)}"
      placeholder="${esc(q.help || "")}">${esc(val ?? "")}</textarea></label>`;
  }
  return `<label class="fld">${lab}<input type="text" id="${id}" data-f="${esc(q.key)}"
    value="${esc(val ?? "")}" placeholder="${esc(q.help || "")}" maxlength="200">${help}</label>`;
}

/* ===== TONIGHT — the nightly ritual =====
   One question per screen. Every step lives in the same form with the inactive
   ones hidden, so stepping never re-renders and nothing typed is ever lost. */
function mealDefaults(iso){
  const plan = planFor(iso), m = (plan && plan.meals) || {};
  const blocks = blocksFor(iso).filter(b => b.kind === "meal");
  return SLOTS.map((slot, i) => {
    const saved = m[slot] || {};
    return {slot,
      at: (saved.at || "").slice(0,5) || (blocks[i] && blocks[i].start) || MEAL_AT[slot],
      what: saved.what || ""};
  });
}
function intentionDefaults(iso){
  const plan = planFor(iso);
  const have = (plan && Array.isArray(plan.intentions) ? plan.intentions : []).slice(0,4);
  const seeds = have.length ? have : blocksFor(iso)
    .filter(b => ["gym","study","class"].includes(b.kind)).slice(0,2)
    .map(b => ({what:b.label, at:b.start, place:"", after:"", two_min:"",
                area: b.kind === "gym" ? "health" : "study", done:false}));
  while (seeds.length < 4) seeds.push(null);
  return seeds.slice(0,4);
}

function viewTonight(){
  const iso = isoDay(), tom = isoDay(1);
  const entry = entryFor(iso), plan = planFor(tom);
  const ans   = (entry && entry.answers) || {};
  const qs    = activeQuestions();
  const quick = qs.filter(q => QUICK.has(q.type));
  const asked = qs.filter(q => !QUICK.has(q.type));
  const meals = mealDefaults(tom);
  const ints  = intentionDefaults(tom);
  const tasks = (plan && plan.tasks) || [];

  const steps = [];
  if (quick.length) steps.push({
    t:"The day, in numbers",
    sub:"Slide and tap. Don't think about it too hard — the first number is usually the honest one.",
    html: quick.map(q => fieldHTML(q, ans[q.key])).join("")
  });
  for (const q of asked) steps.push({
    t: q.label,
    sub: q.help || "Four or five words is plenty.",
    html: fieldHTML(q, ans[q.key], true)
  });

  steps.push({
    t:"Tomorrow's three",
    sub:"Three is a ceiling, not a quota. These are waiting on Today when you wake up.",
    html: [0,1,2].map(i => {
      const t = tasks[i] || {};
      return `<div class="tasknum"><span class="n">${i+1}</span>
        <input type="text" name="task${i+1}" maxlength="140" value="${esc(t.title||"")}"
          placeholder="${i === 0 ? "The one that actually matters" : i === 1 ? "The second thing" : "The third thing"}">
        <select name="area${i+1}">${AREAS.map(x =>
          `<option value="${x}" ${(t.area || ["study","work","health"][i]) === x ? "selected" : ""}>${x}</option>`
        ).join("")}</select></div>`;
    }).join("")
  });

  steps.push({
    t:"What you're eating tomorrow",
    sub:"Decide it now, while you're calm. A meal with a time on it is a decision you don't have to make tomorrow when you're hungry.",
    html: meals.map(m => `<div class="mealrow">
      <span class="sl">${esc(m.slot[0].toUpperCase() + m.slot.slice(1))}</span>
      <input type="time" name="meal_${m.slot}_at" value="${esc(m.at)}" aria-label="${esc(m.slot)} time">
      <input type="text" name="meal_${m.slot}_what" value="${esc(m.what)}" maxlength="120"
        placeholder="${esc(MEAL_HINT[m.slot])}" aria-label="What's for ${esc(m.slot)}"></div>`).join("")
      + `<p class="empty" style="margin-bottom:0">Leave a slot blank if you're genuinely skipping it. Blank beats a lie.</p>`
  });

  steps.push({
    t:"Habits, written so they happen",
    sub:"A habit with a time and a place gets done about twice as often as one you only intend. Hang each on something already in your day, and give it a two-minute version for the night it all goes sideways.",
    html: ints.map((v,i) => {
      const n = i + 1, it = v || {};
      return `<div class="intent">
        <div class="hd"><span class="n">${n}</span>
          <input type="text" name="int${n}_what" maxlength="90" value="${esc(it.what||"")}"
            placeholder="${["I will — e.g. Gym, push day","Read 10 pages","Post the reel","Ring home"][i]}">
          <select name="int${n}_area">${AREAS.map(x =>
            `<option value="${x}" ${(it.area || "health") === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
        <div class="row">
          <label class="fld" style="flex:0 0 118px"><span>at</span>
            <input type="time" name="int${n}_at" value="${esc((it.at||"").slice(0,5))}"></label>
          <label class="fld" style="flex:1 1 150px"><span>in / at</span>
            <input type="text" name="int${n}_place" maxlength="80" value="${esc(it.place||"")}"
              placeholder="the gym, my desk, the kitchen"></label>
          <label class="fld" style="flex:1 1 150px"><span>right after I</span>

      ${steps.map((s,i) => `<button type="button" class="dot ${i ? "" : "on"}" data-step-to="${i}"
        aria-current="${i ? "false" : "step"}" title="${esc(s.t)}"><span>${i+1}</span></button>`).join("")}
    </div>
    ${steps.map((s,i) => `<section class="card step ${i ? "hide" : ""}" data-step-panel="${i}"
      ${s.review ? 'data-review="1"' : ""} ${i === steps.length-1 ? 'data-last="1"' : ""}>

/* Read back from the live form, so it always shows what will actually be saved. */
function fillReview(){
  const form = document.querySelector('[data-form="tonight"]'), box = el("tonightReview");
  if (!form || !box) return;
  const F = new FormData(form), g = k => (F.get(k) || "").toString().trim();
  const row = (k,v) => `<div class="rvrow"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;

  const three = [1,2,3].map(i => g("task"+i)).filter(Boolean);
  const meals = SLOTS.map(s => ({slot:s, at:g("meal_"+s+"_at"), what:g("meal_"+s+"_what")}))
    .filter(m => m.what || m.at);
  const ints = [1,2,3,4].map(n => ({what:g("int"+n+"_what"), at:g("int"+n+"_at"),
    place:g("int"+n+"_place"), after:g("int"+n+"_after"), two:g("int"+n+"_two")})).filter(x => x.what);

  box.innerHTML =
    row("Tomorrow is about", g("theme") || "—") + row("Up at", fmtT(g("wake"))) +

    `<div class="rvhd">Habits</div>` +
    (ints.length ? ints.map(x => `<div class="rvrow"><span class="k">${esc(fmtT(x.at)) || "—"}</span>
      <span class="v">${esc(x.what)}${x.place ? ` · <i>${esc(x.place)}</i>` : ""}${

}

/* ===== NEWS =====
   news.json is written by the Morning news GitHub Action and lives next to
   this page, so it is a same-origin file read — no CORS, no key, no server.
   Everything in it came from a feed, so it is escaped on the way out and
   never treated as markup or instruction. */
async function loadNews(){
  try {
    const r = await fetch("news.json?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error("news.json came back " + r.status);
    const j = await r.json();
    if (!j || typeof j !== "object" || !j.sections) throw new Error("news.json isn't shaped right");
    S.news = j; S.newsErr = null;
  } catch (err){
    S.news = null; S.newsErr = err.message || String(err);
  }
}
const newsSections = () => Object.entries((S.news && S.news.sections) || {});

function newsItem(n){
  return `<a class="nitem" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">
    <span class="hl">${esc(n.title)}</span>
    <span class="mt">${esc(n.source || "")}${n.at ? ` · ${esc(ago(n.at))}` : ""}</span></a>`;
}
function newsStrip(){
  const picks = newsSections().map(([k,s]) => s.items && s.items[0] ? [s.label, s.items[0]] : null).filter(Boolean);
  if (!picks.length) return "";
  return `<section class="card">
    <header><h2>The world, this morning</h2>
      <span class="meta"><button class="btn ghost sm" data-go="news">all of it →</button></span></header>
    <div class="bd newslist">
      ${picks.map(([label,n]) => `<a class="nitem" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">
        <span class="hl">${esc(n.title)}</span>
        <span class="mt">${esc(label)} · ${esc(n.source || "")}${n.at ? ` · ${esc(ago(n.at))}` : ""}</span></a>`).join("")}
    </div></section>`;
}

function viewNews(){
  const secs = newsSections();
  const when = S.news && S.news.fetched_at;

  return `
  <div class="pagehead">

  ${S.newsErr ? `<div class="msg err">Couldn't read the headlines — ${esc(S.newsErr)}.
    The first run of the <b>Morning news</b> action in GitHub creates this file;

  ${!S.newsErr && !secs.length ? `<div class="msg">No headlines stored yet.</div>` : ""}

  <div class="grid2">
    ${[0,1].map(col => `<div class="stack">
      ${secs.filter((_,i) => i % 2 === col).map(([k,s]) => {

/* ---------- actions ---------- */
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go){ S.view = go.dataset.go; render(); return; }

  /* step through tonight without re-rendering, so nothing typed is lost */
  const sj = e.target.closest("[data-step],[data-step-to]");
  if (sj && !sj.disabled){
    const panels = Array.from(document.querySelectorAll("[data-step-panel]"));
    if (!panels.length) return;
    const cur = Math.max(0, panels.findIndex(p => !p.classList.contains("hide")));
    const want = sj.dataset.stepTo != null ? Number(sj.dataset.stepTo)
      : sj.dataset.step === "next" ? cur + 1 : cur - 1;
    const next = Math.max(0, Math.min(panels.length - 1, want));
    panels.forEach((p,i) => p.classList.toggle("hide", i !== next));
    document.querySelectorAll("[data-step-to]").forEach(d => {
      const i = Number(d.dataset.stepTo);
      d.classList.toggle("on", i <= next);
      d.setAttribute("aria-current", i === next ? "step" : "false");
    });
    if (panels[next].dataset.review) fillReview();
    const first = panels[next].querySelector("input:not([type=hidden]),textarea,select");
    if (first) first.focus({preventScroll:true});
    window.scrollTo({top:0});
    return;
  }

  const seg = e.target.closest("[data-bool] button,[data-choice] button");
  if (seg){
    const group = seg.parentElement, on = seg.getAttribute("aria-pressed") === "true";
    group.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed","false"));
    seg.setAttribute("aria-pressed", on ? "false" : "true");   // tapping again clears it
    return;
  }

  if (e.target.closest("[data-backup]")) return backup();

  const dq = e.target.closest("[data-del-q]");
  if (dq){ D.questions = D.questions.filter(q => q.key !== dq.dataset.delQ); save(); render(); return; }

  const dr = e.target.closest("[data-del-routine]");
  if (dr){
    const [wd, start, label] = dr.dataset.delRoutine.split("|");
    D.routine = D.routine.filter(r => !(String(r.weekday) === wd && r.start === start && r.label === label));
    save(); render(); return;
  }
});

document.addEventListener("input", e => {
  const d = e.target.closest("[data-dial]");
  if (d){ const o = el("v_" + d.dataset.dial); if (o) o.textContent = d.value; }
});

document.addEventListener("change", e => {
  const iso = isoDay(), plan = planFor(iso);

  const tk = e.target.closest("[data-task]");
  if (tk && plan && plan.tasks){
    plan.tasks[+tk.dataset.task].done = tk.checked; save(); render(); return;
  }
  const ik = e.target.closest("[data-int]");
  if (ik && plan && plan.intentions){
    plan.intentions[+ik.dataset.int].done = ik.checked; save(); render(); return;
  }
  const mk = e.target.closest("[data-meal]");
  if (mk && plan && plan.meals && plan.meals[mk.dataset.meal]){
    plan.meals[mk.dataset.meal].ate = mk.checked; save(); render(); return;
  }
  const qs = e.target.closest("[data-qsort]");
  if (qs){
    const q = D.questions.find(x => x.key === qs.dataset.qsort);
    if (q){ q.sort = Number(qs.value) || 0; save(); render(); }
    return;
  }
  const rf = e.target.closest("#restoreFile");
  if (rf && rf.files && rf.files[0]) return restore(rf.files[0]);
});

/* Enter moves to the next question rather than submitting the whole ritual. */
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName === "TEXTAREA") return;
  if (!e.target.closest('[data-form="tonight"]')) return;
  const panel = e.target.closest("[data-step-panel]");
  if (!panel || panel.dataset.last === "1") return;
  const nx = panel.querySelector('[data-step="next"]');
  if (nx){ e.preventDefault(); nx.click(); }
});

document.addEventListener("submit", e => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  const F = new FormData(form), g = k => (F.get(k) || "").toString().trim();

  if (form.dataset.form === "settings"){
    D.settings.name  = g("name");
    D.settings.wake  = g("wake")  || D.settings.wake;
    D.settings.sleep = g("sleep") || D.settings.sleep;
    if (save()) flash("Saved.");
    return;
  }

  if (form.dataset.form === "addq"){
    const label = g("label");
    let key = label.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,30) || "q";
    while (D.questions.some(q => q.key === key)) key += "_1";
    const type = g("type") || "short";
    D.questions.push({key, label, type, help:g("help") || null, active:true,
      section: QUICK.has(type) ? "The day, in numbers" : "Four or five words",
      sort: Math.max(0, ...D.questions.map(q => q.sort)) + 1,
      ...(type === "scale" ? {min:1, max:10} : {})});
    if (save()){ flash("Added. You'll be asked tonight."); render(); }
    return;
  }

  if (form.dataset.form === "addroutine"){
    D.routine.push({weekday:Number(g("weekday")), start:g("start"), end:g("end"),
      label:g("label"), kind:g("kind") || "self"});
    if (save()) render();
    return;
  }

  if (form.dataset.form === "tonight"){
    const iso = isoDay(), tom = isoDay(1);

    const read = q => {
      if (q.type === "bool"){
        const w = form.querySelector(`[data-bool="${q.key}"] [aria-pressed="true"]`);
        return w ? w.dataset.v === "1" : null;
      }
      if (q.type === "choice"){
        const w = form.querySelector(`[data-choice="${q.key}"] [aria-pressed="true"]`);
        return w ? w.dataset.v : null;
      }
      const inp = form.querySelector(`[data-f="${q.key}"]`);
      if (!inp) return null;
      const v = String(inp.value).trim();
      if (v === "") return null;
      return (q.type === "scale" || q.type === "number") ? Number(v) : v;
    };

    const answers = {};
    for (const q of activeQuestions()){
      const v = read(q);
      if (v !== null) answers[q.key] = v;
    }
    D.entries[iso] = {at:new Date().toISOString(), answers};

    const meals = {};
    for (const slot of SLOTS){
      const what = g("meal_" + slot + "_what"), at = g("meal_" + slot + "_at");
      if (what || at) meals[slot] = {at: at || null, what: what || null, ate:false};
    }
    // a habit you already ticked off keeps its tick if you re-save the same plan
    const was = new Map(((planFor(tom) || {}).intentions || [])
      .filter(x => x && x.what).map(x => [x.what, !!x.done]));
    const intentions = [1,2,3,4].map(n => {
      const what = g("int" + n + "_what");
      if (!what) return null;
      return {what, at:g("int"+n+"_at") || null, place:g("int"+n+"_place") || null,
        after:g("int"+n+"_after") || null, two_min:g("int"+n+"_two") || null,
        area:g("int"+n+"_area") || "self", done: was.get(what) || false};
    }).filter(Boolean);

    const wasTasks = new Map(((planFor(tom) || {}).tasks || []).map(t => [t.title, !!t.done]));
    const tasks = [1,2,3].map(i => {
      const title = g("task" + i);
      return title ? {title, area:g("area" + i) || "work", done: wasTasks.get(title) || false} : null;
    }).filter(Boolean);

    D.plans[tom] = {wake:g("wake") || D.settings.wake, sleep:g("sleep") || D.settings.sleep,
      theme:g("theme") || null, meals, intentions, tasks, planned_at:new Date().toISOString()};

    if (!save()) return;
    S.view = "today";
    flash(`Day closed out. Tomorrow is planned — ${tasks.length} task${tasks.length===1?"":"s"}, ${
      Object.keys(meals).length} meal${Object.keys(meals).length===1?"":"s"}, ${
      intentions.length} habit${intentions.length===1?"":"s"}.`);
  }
});

/* ---------- backup and restore ----------
   The only insurance against a cleared browser, and the only way onto a second
   device. One file, the whole store, human-readable. */
function backup(){
  const blob = new Blob([JSON.stringify(D, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `life-backup-${isoDay()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  flash("Backed up. Keep it somewhere you'll find it.");
}
async function restore(file){
  try {
    const text = await file.text();
    const incoming = JSON.parse(text);
    if (!incoming || typeof incoming !== "object" || !incoming.entries || !incoming.plans)
      throw new Error("that file isn't a Life backup");

    const mine = Object.keys(D.entries).length + Object.keys(D.plans).length;
    const theirs = Object.keys(incoming.entries).length + Object.keys(incoming.plans).length;
    if (mine && !confirm(
      `Restoring replaces what's in this browser.\n\n`
      + `Here now: ${mine} day${mine === 1 ? "" : "s"}.\nIn the file: ${theirs} day${theirs === 1 ? "" : "s"}.\n\n`
      + `Go ahead?`)) return;

    D = Object.assign(seed(), incoming);
    if (save()){ render(); flash(`Restored ${theirs} day${theirs === 1 ? "" : "s"}.`); }
  } catch (err){
    flash("Couldn't restore that file — " + (err.message || err), "err");
  }
}

/* ---------- theme ---------- */
el("themeBtn").addEventListener("click", () => {
  const now = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = now === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("life:theme", next); } catch {}
});
try { const t = localStorage.getItem("life:theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}

/* ---------- start ---------- */
(async function start(){
  const had = load();
  if (!had) save();                     // first visit: write the seed so it's yours to edit
  render();
  await loadNews();                     // the page is already usable; news lands when it lands
  if (S.view === "today" || S.view === "news") render();
})();
</script>
